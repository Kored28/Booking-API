<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment</title>
<style>
:root{--bg:#eef4f2;--ink:#0d3640;--muted:#4f6f75;--line:#c5d9d4;--accent:#14766a;--accent-ink:#fff;--card:#fff;--bad:#a8321f;--ok-bg:#d9efe8}
@media (prefers-color-scheme:dark){:root{--bg:#0b1d21;--ink:#e3f0ee;--muted:#8fb0ac;--line:#25454a;--accent:#4fc3ae;--accent-ink:#06211d;--card:#112a2f;--bad:#ff907a;--ok-bg:#16403a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 20px 64px}
h1{font:600 clamp(28px,5vw,40px)/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 24px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.day{margin:14px 0 6px;font-weight:600}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.slot[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.slot:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.btn{padding:10px 18px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:600 16px inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:wait}
#msg{min-height:1.5em;margin:12px 0 0;color:var(--bad)}
#confirm{background:var(--ok-bg);display:none}
#confirm dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0 0 14px}
#confirm dt{color:var(--muted)}#confirm dd{margin:0;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>Book an appointment</h1>
  <p class="sub">Pick a time, tell us who you are, and get a confirmation straight away.</p>

  <section>
    <label for="key">API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="Paste your API key">
  </section>

  <section>
    <h2>Available times</h2>
    <div id="slots" aria-live="polite">Enter your API key to see available times.</div>
  </section>

  <section>
    <h2>Your details</h2>
    <div class="row">
      <div><label for="name">Full name</label><input id="name" autocomplete="name"></div>
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="email"></div>
    </div>
    <p id="chosen" style="color:var(--muted)">No time selected.</p>
    <button class="btn" id="book" disabled>Book appointment</button>
    <p id="msg" role="alert"></p>
  </section>

  <section id="confirm" aria-live="polite">
    <h2>Booking confirmed</h2>
    <dl id="details"></dl>
    <button class="btn ghost" id="cancel">Cancel this booking</button>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = (d, o) => new Date(d).toLocaleString(undefined, o);
let selected = null, current = null, idemKey = null;

$('key').value = sessionStorage.getItem('key') || '';
$('key').addEventListener('change', () => { sessionStorage.setItem('key', $('key').value.trim()); loadSlots(); });

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-API-Key': $('key').value.trim(), ...(opts.headers || {}) } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || 'Request failed'), { status: res.status, retryAfter: res.headers.get('Retry-After') });
  return body;
}

async function loadSlots() {
  const box = $('slots');
  try {
    const { slots } = await api('/api/v1/slots');
    const providers = new Set(slots.map(s => s.provider));
    const days = {};
    slots.filter(s => new Date(s.start) > new Date())
      .forEach(s => (days[fmt(s.start, { weekday: 'long', day: 'numeric', month: 'long' })] ||= []).push(s));
    box.innerHTML = '';
    if (!Object.keys(days).length) box.textContent = 'No upcoming slots.';
    Object.entries(days).forEach(([day, list]) => {
      const h = document.createElement('div'); h.className = 'day'; h.textContent = day; box.append(h);
      const wrap = document.createElement('div'); wrap.className = 'slots';
      list.forEach(s => {
        const b = document.createElement('button');
        b.className = 'slot';
        b.textContent = fmt(s.start, { hour: '2-digit', minute: '2-digit' }) + (providers.size > 1 && s.provider ? ' (' + s.provider + ')' : '');
        b.disabled = !s.available; b.setAttribute('aria-pressed', selected?.id === s.id);
        b.onclick = () => {
          selected = s; idemKey = null;
          $('chosen').textContent = 'Selected: ' + fmt(s.start, { dateStyle: 'full', timeStyle: 'short' }) + (s.provider ? ' with ' + s.provider : '');
          $('book').disabled = false; loadSlots();
        };
        wrap.append(b);
      });
      box.append(wrap);
    });
  } catch (e) { box.textContent = e.status === 401 ? 'That API key was not accepted. Check it and try again.' : e.message; }
}

$('book').onclick = async () => {
  $('msg').textContent = '';
  $('book').disabled = true;
  idemKey ||= crypto.randomUUID(); // reused if the same attempt is retried
  const slot = selected;
  try {
    const b = await api('/api/v1/bookings', { method: 'POST', headers: { 'Idempotency-Key': idemKey },
      body: JSON.stringify({ slot_id: slot.id, name: $('name').value, email: $('email').value }) });
    current = { ...b, slot };
    showConfirmation(current); selected = null; idemKey = null; $('chosen').textContent = 'No time selected.'; loadSlots();
  } catch (e) {
    $('msg').textContent = e.status === 409 ? 'Someone just took that time. Pick another one.'
      : e.status === 429 ? 'Too many attempts for this email. Try again in ' + (e.retryAfter || 60) + ' seconds.'
      : e.message;
    if (e.status === 409) { selected = null; idemKey = null; $('chosen').textContent = 'No time selected.'; loadSlots(); }
    else $('book').disabled = !selected;
  }
};

function showConfirmation(b) {
  $('details').innerHTML = '';
  const rows = [['Reference', b.id], ['Name', b.name], ['Email', b.email]];
  if (b.slot) rows.push(['When', fmt(b.slot.start, { dateStyle: 'full', timeStyle: 'short' })], ['Provider', b.slot.provider]);
  rows.push(['Status', b.status]);
  rows.forEach(([k, v]) => { const dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; $('details').append(dt, dd); });
  $('cancel').style.display = b.status === 'confirmed' ? '' : 'none';
  $('confirm').style.display = 'block'; $('confirm').scrollIntoView({ behavior: 'smooth' });
}

$('cancel').onclick = async () => {
  try { const b = await api('/api/v1/bookings/' + current.id, { method: 'DELETE' }); current = { ...current, ...b }; showConfirmation(current); loadSlots(); }
  catch (e) { $('msg').textContent = e.message; }
};

if ($('key').value) loadSlots();
</script>
</body>
</html>
